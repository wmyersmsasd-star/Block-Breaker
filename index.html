<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="home-screen" class="home-screen" aria-labelledby="game-title">
      <div class="brick-showcase" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="eyebrow">Ready, set, smash!</p>
      <h1 id="game-title">BLOCK<br><span>BREAKER</span></h1>
      <p class="home-copy">Bounce the ball. Break every brick. Keep your 3 lives!</p>
      <button id="play-button" type="button">PLAY NOW <span aria-hidden="true">&#9654;</span></button>
      <p class="home-hint">Move: ← → or A / D · Catch power-ups to get stronger</p>
    </section>

    <section id="game-view" hidden>
      <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
      <div class="touch-controls" aria-label="Touch controls">
        <button type="button" data-key="arrowleft" aria-label="Move left">&#8592;</button>
        <button type="button" data-key="arrowright" aria-label="Move right">&#8594;</button>
      </div>
      <p class="powerup-legend"><span><b>W</b> wider paddle</span><span><b>S</b> slow ball</span><span><b>+</b> extra life</span></p>
      <p>Move with ← →, A / D, or touch controls. Press R to restart after game over.</p>
    </section>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>
